<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
<title id="title">How Rufajx-DSH fits together</title>
<desc id="desc">An employee uses the Windows app. Local tools work with files, the desktop and SolidWorks. The company server handles login, shared records and the model API connection. Upstream API keys stay on the server.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#8fa5b5" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="310" rx="18" fill="#151c23"/>
<g font-family="Segoe UI, Arial, sans-serif">
 <text x="32" y="38" fill="#a9b7c1" font-size="12" letter-spacing="1.7">A SIMPLE WAY TO THINK ABOUT IT</text>
 <rect x="32" y="68" width="338" height="202" rx="13" fill="#1a292b" stroke="#44615a"/>
 <text x="56" y="98" fill="#b7ebd7" font-size="11" letter-spacing="1.3">ON THE EMPLOYEE’S COMPUTER</text>
 <text x="56" y="135" fill="#f0f5f6" font-size="24" font-weight="600">Rufajx-DSH</text>
 <text x="56" y="162" fill="#aebdc6" font-size="14">Chat, projects, and a preview of the work</text>
 <path d="M56 184H346" stroke="#385149"/>
 <text x="56" y="213" fill="#c8ded5" font-size="15">Files · Desktop · SolidWorks</text>
 <text x="56" y="240" fill="#aebdc6" font-size="13">Local tools run here, with tool approval.</text>

 <path d="M385 164H463" stroke="#8fa5b5" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
 <text x="424" y="144" text-anchor="middle" fill="#8fa5b5" font-size="11">HTTPS</text>
 <rect x="480" y="88" width="310" height="162" rx="13" fill="#202934" stroke="#48596d"/>
 <text x="504" y="119" fill="#b1c9ed" font-size="11" letter-spacing="1.3">MANAGED BY THE COMPANY</text>
 <text x="504" y="156" fill="#f0f5f6" font-size="24" font-weight="600">Company server</text>
 <text x="504" y="187" fill="#b5c0cb" font-size="14">Accounts · Permissions · Conversations</text>
 <text x="504" y="218" fill="#cfddf0" font-size="13">The upstream API key stays here.</text>

 <path d="M805 164H883" stroke="#8fa5b5" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
 <text x="844" y="144" text-anchor="middle" fill="#8fa5b5" font-size="11">API</text>
 <rect x="900" y="111" width="268" height="116" rx="13" fill="#2b2821" stroke="#645b45"/>
 <text x="924" y="150" fill="#f2d5a0" font-size="23" font-weight="600">Model service</text>
 <text x="924" y="181" fill="#c9c0ad" font-size="14">DeepSeek via the company gateway</text>
 <text x="924" y="207" fill="#a49a87" font-size="12">No employee API key setup</text>
</g></svg>
